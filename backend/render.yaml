services:
  - type: web
    name: resumesh-admin-backend
    runtime: docker
    dockerContext: ./
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: MEDIUM_USERNAME
        sync: false
      - key: DEVTO_USERNAME
        sync: false
      - key: ENABLE_ADMIN_WORKSPACE
        value: "true"
      - key: ENABLE_CRON_JOBS
        value: "true"
      - key: REACTIVE_RESUME_URL
        sync: false
      - key: REACTIVE_RESUME_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
