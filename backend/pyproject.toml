[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resumesh-admin-backend"
version = "0.1.0"
description = "FastAPI Management & Admin Dashboard Service for ResuMesh"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.30.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "slowapi>=0.1.10",
    "sentry-sdk>=1.39.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "Faker>=25.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
